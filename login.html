<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>访问验证 · 重点ETF资金看板</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f6f9; color: #1f2d3d;
  }
  .card {
    width: 100%; max-width: 560px; background: #fff;
    border: 1px solid #e3e8ef; border-radius: 14px;
    box-shadow: 0 8px 32px rgba(31,45,61,.07);
    padding: 30px 32px 24px;
  }
  .brand { font-size: 12px; letter-spacing: 1px; color: #98a4b3; margin-bottom: 10px; }
  h1 { font-size: 21px; margin: 0 0 6px; line-height: 1.45; font-weight: 600; }
  .sub { font-size: 13px; color: #7a8899; margin-bottom: 26px; }
  .rule { height: 1px; background: #eef1f5; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #4b5b6c; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; }
  input[type=password] {
    flex: 1; min-width: 0; height: 42px; padding: 0 14px; font-size: 15px;
    border: 1px solid #d7dfe8; border-radius: 8px; outline: none;
    font-family: inherit; transition: border-color .15s, box-shadow .15s;
  }
  input[type=password]:focus { border-color: #d93630; box-shadow: 0 0 0 3px rgba(217,54,48,.10); }
  button.go {
    height: 42px; padding: 0 22px; border: 0; border-radius: 8px; cursor: pointer;
    background: #d93630; color: #fff; font-size: 14px; font-weight: 500; font-family: inherit;
    white-space: nowrap; transition: background .15s;
  }
  button.go:hover { background: #c22f29; }
  button.go:disabled { background: #c9ced6; cursor: default; }
  .err { min-height: 20px; margin-top: 10px; font-size: 13px; color: #d93630; }
  .notice {
    margin-top: 18px; padding: 15px 18px; border-radius: 10px;
    background: #fafbfc; border: 1px solid #eef1f5;
    font-size: 12.5px; line-height: 1.85; color: #4b5b6c;
  }
  .notice b { color: #1f2d3d; font-weight: 600; }
  .notice-title { font-size: 14px; font-weight: 600; color: #1f2d3d; margin-bottom: 6px; }
  .notice p { margin: 0 0 5px; }
  .notice code { font-size: 13px; font-weight: 600; color: #d93630; font-family: inherit;
                 padding: 1px 4px; background: #fff; border-radius: 4px; }
  .foot { margin-top: 16px; font-size: 12px; color: #a6b0bd; text-align: center; line-height: 1.7; }
  .demo { display: inline-block; margin-top: 6px; padding: 4px 10px; border-radius: 5px;
          background: #fff7e6; color: #a56a00; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">机构服务</div>
  <h1>重点ETF资金看板</h1>
  <div class="rule"></div>

  <label for="pwd">请输入访问密码</label>
  <div class="row">
    <input type="password" id="pwd" placeholder="访问密码" autocomplete="current-password" autofocus>
    <button class="go" id="go">进入看板</button>
  </div>
  <div class="err" id="err"></div>

  <div class="notice">
    <div class="notice-title">关于使用范围的说明</div>
    <p>本看板仅面向已签约的机构投资者提供，不对个人投资者开放。</p>
    <p>如需获取访问密码，请联系对口销售。</p>
  </div>

  <div class="foot">
    客观数据仅供参考，不构成投资建议。<br>
  </div>
</div>
<script>
(function () {
  var pwd = document.getElementById("pwd"), go = document.getElementById("go"),
      err = document.getElementById("err");
  function submit() {
    var v = (pwd.value || "").trim();
    if (!v) { err.textContent = "请输入访问密码"; return; }
    go.disabled = true; err.textContent = "";
    fetch("/api/verify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: v })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) { location.href = "/"; return; }
      err.textContent = "密码不正确，请重新输入或联系对口销售";
      go.disabled = false; pwd.select();
    }).catch(function () {
      err.textContent = "验证服务暂不可用，请稍后再试";
      go.disabled = false;
    });
  }
  go.addEventListener("click", submit);
  pwd.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
})();
</script>
</body>
</html>
